      html, body {

        padding: 40px 32px;
        max-width: 90vw;
      }

      .badge-circle {

        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 30px;
        box-shadow: 0 14px 34px rgba(20, 60, 30, 0.14), 0 2px 8px rgba(20, 60, 30, 0.08);
      }

      .badge-circle img {
        width: 70%;
        height: auto;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(15, 92, 52, 0.15);
        border-top-color: #0F5C34;
        border-radius: 50%;
        margin: 0 auto 20px;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }

      a:hover {
        border-bottom-color: #0F5C34;

      }
